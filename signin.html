<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .toplinks {
            background-color: #333;
            overflow: hidden;
        }
        .toplinks a {
            float: left;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        .toplinks a:hover {
            background-color: #ddd;
            color: black;
        }
        h1 {
            text-align: center;
            margin-top: 50px;
        }
        .signin-form {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .signin-form label {
            display: block;
            margin-bottom: 8px;
        }
        .signin-form input[type="text"],
        .signin-form input[type="email"],
        .signin-form input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 3px;
            border: 1px solid #ccc;
        }
        .signin-form input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .signin-form input[type="submit"]:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="toplinks">
        <a href="index.html">Home</a>
        <a href="about.html">About Page</a> 
        <a href="contact.html">Contact Page</a>
        <a href="events.html">Events Page</a> 
        <a href="courses.html">Courses Page</a>
        <a href="school.html">Schools Page</a>
        <a href="students.html">Students Page</a>
        <a href="application.html">Application Page</a>
        <a href="signin.html">Sign In</a> 
        <a href="signup.html">Sign Up</a>
    </div>
    <h1>Sign In</h1>
    <form action="" method="post" class="signin-form">
        <label for="username">Username: </label><br>
        <input type="text" id="username" name="username" placeholder="Enter your username" required><br><br>

        <label for="email">Email: </label><br>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="password">Password: </label><br>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

        <label for="confirm-password">Confirm Password: </label><br>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required><br><br>

        <input type="submit" value="Sign In">
</body>
</html>
